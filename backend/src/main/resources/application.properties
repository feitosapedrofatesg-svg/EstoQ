spring.application.name=estoq

# conexão com o banco (PostgreSQL via Docker - porta 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/estoq
spring.datasource.username=estoq
spring.datasource.password=estoq

# driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8082

# limite de upload para importação da planilha (XLS/XLSX)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# datas iniciais do mês de referência para os relatórios
estoq.mes.padrao=12
estoq.ano.padrao=2023

# autenticação por PIN
estoq.sessao.expiracao-horas=24