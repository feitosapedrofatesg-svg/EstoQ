# Perfil de ENTREGA: um único jar autossuficiente, sem Docker/Postgres.
# Banco embutido H2 em arquivo, na pasta ./dados ao lado do jar.

spring.application.name=estoq

# banco embutido (arquivo), compatível com o estilo PostgreSQL usado no dev
spring.datasource.url=jdbc:h2:file:./dados/estoq;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# servidor: por padrão escuta SÓ local (app de computador único).
# Para liberar para tablets/celulares da rede local, inicie com ESTOQ_ADDRESS=0.0.0.0
server.address=${ESTOQ_ADDRESS:127.0.0.1}
server.port=8081

# limite de upload para importação da planilha (XLS/XLSX)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# datas iniciais do mês de referência para os relatórios
estoq.mes.padrao=12
estoq.ano.padrao=2023

# autenticação por PIN
estoq.sessao.expiracao-horas=24

# backup automático diário (cron padrão 03:30; desligue com ESTOQ_BACKUP_HABILITADO=false)
estoq.backup.habilitado=${ESTOQ_BACKUP_HABILITADO:true}

# OCR de recibos (foto de cupom fiscal)
estoq.ocr.tesseract-path=/usr/bin/tesseract
estoq.ocr.data-path=/usr/share/tesseract-ocr/5/tessdata
estoq.ocr.language=por

# documentação interativa da API desligada em produção (schema exposto sem auth)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false